name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Check lockfile
        run: uv lock --check

      - name: Sync
        run: uv sync --locked --group dev

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: ty
        run: uv run ty check

      - name: Pytest
        run: uv run pytest --cov --cov-branch --cov-fail-under=90 -m "not nftables"

      - name: Build
        run: uv build

      - name: Inspect artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, zipfile
          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert wheels and sdists, dist.iterdir()
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          assert any(n.startswith("sslstrip/") for n in names)
          assert not any("lock.ico" in n or "ClientRequest" in n for n in names)
          with tarfile.open(sdists[0], "r:gz") as tf:
              tnames = tf.getnames()
          assert any("/src/sslstrip/" in n or n.endswith("/src/sslstrip") for n in tnames)
          PY

      - name: Clean-environment wheel smoke
        run: |
          uv venv --python 3.14 .smoke
          uv pip install --python .smoke dist/*.whl
          .smoke/bin/sslstrip --version
          .smoke/bin/sslstrip run -h
          .smoke/bin/sslstrip doctor -h
          .smoke/bin/sslstrip cleanup -h

      - name: Trailing whitespace
        run: git diff --check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  nftables:
    name: nftables namespace
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Sync
        run: uv sync --locked --group dev

      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2

      - name: Run nftables tests
        run: sudo env "PATH=$PATH" SSLSTRIP_NFT_TESTS=1 .venv/bin/pytest -m nftables -vv
