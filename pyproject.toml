[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[project]
name = "sslstrip"
version = "5.0.0"
description = "A MITM HTTPS-stripping proxy for authorized testing."
authors = [
    { name = "Moxie Marlinspike", email = "moxie@thoughtcrime.org" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Twisted[tls]==26.4.0",
    "Brotli==1.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "ty==0.0.73",
]

[project.scripts]
sslstrip = "sslstrip.cli:main"

[tool.uv]
python-preference = "managed"
exclude-newer = "1 week"

[tool.ruff]
target-version = "py314"
line-length = 130
src = ["src", "tests"]
show-fixes = true
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".github",
    ".venv",
    ".vscode",
    ".idea",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "ANN",
    "ASYNC",
    "B",
    "SIM",
    "S",
    "PT",
    "RUF",
    "TC",
]
ignore = [
    "TC001",
    "TC002",
    "TC003",
    "ASYNC109",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S311", "S603", "S607"]
"src/sslstrip/nftables.py" = ["S404", "S603", "S607"]
"src/sslstrip/supervisor.py" = ["S404", "S603", "S607"]
"src/sslstrip/doctor.py" = ["S404", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["sslstrip"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
strict-generic-narrowing = true
strict-equality-semantics = true

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
    "nftables: privileged nftables network-namespace tests",
]

[tool.coverage.run]
branch = true
source = ["sslstrip"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 94
show_missing = true
omit = ["src/sslstrip/__main__.py"]
